[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nismod-trackset"
version = "0.1.0a2"
description = "Normalise tropical cyclone track sets (IBTrACS, STORM, IRIS, CHAZ, Emanuel) to a common GeoDataFrame schema"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name="Tom Russell", email="tom.russell@ouce.ox.ac.uk"},
  {name="Fred Thomas", email="fred.thomas@eci.ox.ac.uk"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "geopandas>=0.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "shapely>=2.0",
]

[project.optional-dependencies]
chaz = ["xarray>=2023.1", "netcdf4"]  # raw CHAZ netCDF ingest
emanuel = ["scipy"]  # raw Emanuel MATLAB ingest
test = ["pytest", "xarray>=2023.1"]

[project.urls]
"Homepage" = "https://github.com/nismod/open-gira/tree/main/libs/trackset"
"Bug Tracker" = "https://github.com/nismod/open-gira/issues"

[tool.setuptools.packages.find]
where = ["src"]
