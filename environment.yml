name: open-gira
channels:
- conda-forge
- bioconda
- nodefaults
dependencies:
- python ~=3.12
- pip *
- cython *
- dask *
- datashader *
- gdal *
- geopandas >=1.1,<2
- igraph *
- ipykernel *
- jq *
- jupyter *
- matplotlib *
- nb_conda_kernels *
- nbstripout *
- netcdf4 *
- networkx >=3.2,<4
- numpy >=1.26,<3
- openpyxl *
- osmium-tool ==1.14.0
- pandas *
- pulp >=2.8.0,<3
- pyarrow *
- pyogrio *
- pyproj *
- pyrosm *
- pytest *
- pytest-xdist *
- rasterio *
- rasterstats *
- requests *
- rioxarray *
- ruff ==0.17
- scipy *
- bioconda::snakemake ~=9.27
- bioconda::snakemake-executor-plugin-slurm *
- snkit *
- spatialpandas *
- tabulate *
- tqdm *
- xarray *
- zarr *
- zenodo_get *
- pip
- pip:
  - nismod-snail
  - osmium
  - irv-datapkg
  - -e .
