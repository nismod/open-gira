name: pyTest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install ImageMagick
        uses: mfinelli/setup-imagemagick@v8
        with:
          cache: true

      - name: Install Python environment
        uses: prefix-dev/setup-pixi@v0.11.1
        with:
          pixi-version: v0.82.0
          cache: true
          activate-environment: true
          log-level: vv

      - name: Ruff format and check
        run: |
          pixi run format --check --diff
          pixi run check

      - name: Check environment.yml is consistent with pixi
        run: |
          pixi workspace export conda-environment --name open-gira  > environment.yml
          git diff --exit-code environment.yml

      - name: Test with pytest
        run: |
          osmium --version
          magick --version

          pixi run test -n auto
