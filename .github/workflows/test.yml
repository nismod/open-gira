name: pyTest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install ImageMagick
        uses: mfinelli/setup-imagemagick@v8
        with:
          cache: true

      - name: Install Python environment
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.59.0
          cache: true
          activate-environment: true
          log-level: vv

      - name: Ruff format check
        run: pixi run ruff format --check --diff

      - name: Check environment.yml is consistent with pixi
        run: |
          pixi workspace export conda-environment --name open-gira  > environment.yml
          git diff --exit-code environment.yml

      - name: Test with pytest
        run: |
          osmium --version
          magick --version

          python -m pytest -n auto
