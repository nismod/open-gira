[workspace]
authors = ["Fred Thomas <fred.thomas@eci.ox.ac.uk>", "Tom Russell <tom.russell@ouce.ox.ac.uk>"]
channels = ["conda-forge", "bioconda"]
name = "open-gira"
platforms = ["linux-64", "osx-64"]
version = "0.1.1"

[tasks]
test = "python -m pytest tests -n4"
format = "ruff format"
check = "ruff check"

[dependencies]
python = "~=3.12"
pip = "*"
cython = "*"
dask = "*"
datashader = "*"
gdal = "*"
geopandas = ">=1.1,<2"
igraph = "*"
ipykernel = "*"
jq = "*"
jupyter = "*"
matplotlib = "*"
nb_conda_kernels = "*"
nbstripout = "*"
netcdf4 = "*"
networkx = ">=3.2,<4"
numpy = ">=1.26,<3"
openpyxl = "*"
osmium-tool = "==1.14.0"
pandas = "*"
pulp = ">=2.8.0,<3"
pyarrow = "*"
pyogrio = "*"
pyproj = "*"
pyrosm = "*"
pytest = "*"
pytest-xdist = "*"
rasterio = "*"
rasterstats = "*"
requests = "*"
rioxarray = "*"
ruff = "==0.17"
scipy = "*"
snakemake = { version = "~=9.27", channel = "bioconda" }
snakemake-executor-plugin-slurm = { version = "*", channel = "bioconda" }
snkit = "*"
spatialpandas = "*"
tabulate = "*"
tqdm = "*"
xarray = "*"
zarr = "*"
zenodo_get = "*"

[pypi-dependencies]
nismod-snail = "*"
osmium = "*"
irv-datapkg = "*"
open_gira = { path = ".", editable = true }
