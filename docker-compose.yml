version: '3.7'

services:
  # The bundled application Dockerfile was removed; it no longer built and
  # predated the move to the pixi lockfile. For running open-gira in a
  # container, see docs/src/user-guide/installation/docker.md, which gives a
  # fresh, minimal setup based on the maintained pixi image. Once you have
  # created a Dockerfile from that guide, you can re-add an `app` service here:
  #
  # app:
  #   build: .
  #   volumes:
  #     - .:/open-gira

  # https://github.com/peaceiris/docker-mdbook
  mdbook:
    container_name: mdbook
    image: peaceiris/mdbook:v0.4.15           # Minimum image
    # image: peaceiris/mdbook:v0.x.x-rust     # `mdbook test` subcommand is available
    # image: ghcr.io/peaceiris/mdbook:v0.x.x  # Docker images on GitHub Packages
    stdin_open: true
    tty: true
    ports:
      - 3000:3000
      - 3001:3001
    volumes:
      - ./docs:/book
    command:
      - serve
      - --hostname
      - '0.0.0.0'
