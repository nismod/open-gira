version: '3.7'

services:
  # Runs open-gira in the container built from the repository Dockerfile
  # (pixi image + locked environment). For example:
  #   docker compose build app
  #   docker compose run --rm app                       # interactive shell
  #   docker compose run --rm app snakemake -n --cores 2 -- <target>
  app:
    build: .
    volumes:
      - .:/open-gira
      # Preserve the image's installed pixi environment: without this anonymous
      # volume, the bind mount above would shadow /open-gira/.pixi.
      - /open-gira/.pixi

  # https://github.com/peaceiris/docker-mdbook
  mdbook:
    container_name: mdbook
    image: peaceiris/mdbook:v0.4.15           # Minimum image
    # image: peaceiris/mdbook:v0.x.x-rust     # `mdbook test` subcommand is available
    # image: ghcr.io/peaceiris/mdbook:v0.x.x  # Docker images on GitHub Packages
    stdin_open: true
    tty: true
    ports:
      - 3000:3000
      - 3001:3001
    volumes:
      - ./docs:/book
    command:
      - serve
      - --hostname
      - '0.0.0.0'
